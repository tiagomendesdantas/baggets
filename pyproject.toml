[project]
name = "baggets"
version = "0.1.0"
description = "Bagged bootstrap ETS ensembles with pluggable selection — Python reimplementation of Bagged.Cluster.ETS (Dantas & Cyrino Oliveira, IJF 2018)"
readme = "README.md"
authors = [{ name = "Tiago Mendes Dantas" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsforecast>=2.1.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "kmedoids>=0.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
aws = [
    "boto3>=1.34",
]
experiments = [
    "pyarrow",
    "tqdm",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baggets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the local M3 export and/or minutes of compute"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY", "UP", "B"]
ignore = ["E501"]
