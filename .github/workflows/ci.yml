name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# uv reads the Python version from .python-version and installs it if needed.
# Neither job needs R or the M3 data: tests that do skip with a reason (-rs).
# Benchmarks and M3 experiments are run by hand, never here.

jobs:
  core:
    name: Tests (core, no PyTorch, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}   # overrides .python-version
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install core dependencies and dev tools
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -n auto -rs

  extras:
    name: Tests with torch and aws extras (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install with the torch and aws extras
        run: uv sync --locked --extra torch --extra aws
      - name: Run tests
        run: uv run pytest -n auto -rs
